name: Fusionner les mises a jour verifiees

# Se declenche quand la verification (CI) d'une proposition se termine.
# Volontairement separe du CI : ce traitement n'execute JAMAIS le code de la
# proposition, il ne fait que lire ses metadonnees et decider de la fusionner.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  fusionner:
    # Dependabot pousse toujours ses branches dans ce dépôt-ci : une vérification
    # venue d'une copie externe n'a rien à faire dans ce job, qui peut écrire.
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      startsWith(github.event.workflow_run.head_branch, 'dependabot/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Retrouver la proposition
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPOT: ${{ github.repository }}
          # Le nom de branche est choisi par l'auteur de la proposition : il
          # passe par une variable, jamais dans le texte du script, pour qu'on
          # ne puisse pas y glisser une commande.
          BRANCHE: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          NUM=$(gh pr list --repo "$DEPOT" --state open --head "$BRANCHE" \
                 --json number --jq '.[0].number // empty')
          [ -n "$NUM" ] || { echo "Aucune proposition ouverte sur cette branche."; exit 0; }
          echo "numero=$NUM" >> "$GITHUB_OUTPUT"

      - name: Fusionner si la mise a jour est sans risque
        if: steps.pr.outputs.numero != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPOT: ${{ github.repository }}
          NUMERO_PR: ${{ steps.pr.outputs.numero }}
          # Le commit exact que la vérification a validé : seul celui-là peut
          # être fusionné, jamais une tête poussée après coup.
          SHA_VERIFIE: ${{ github.event.workflow_run.head_sha }}
        run: python3 scripts/fusionner-mise-a-jour.py
